<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>图像美学质量评分问卷</title>
  <style>
    :root {
      --bg: #f6f7fb;
      --card: #ffffff;
      --text: #172033;
      --muted: #667085;
      --line: #e4e7ec;
      --primary: #2563eb;
      --primary-soft: #eff6ff;
      --danger: #dc2626;
      --success: #16a34a;
      --shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
      --radius: 18px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
        "Hiragino Sans GB", "Microsoft YaHei", Arial, sans-serif;
      line-height: 1.6;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 20;
      background: rgba(246, 247, 251, 0.94);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--line);
    }

    .topbar {
      max-width: 1120px;
      margin: 0 auto;
      padding: 12px 20px;
      display: flex;
      gap: 16px;
      align-items: center;
      justify-content: space-between;
    }

    .title { font-weight: 750; font-size: 18px; white-space: nowrap; }

    .progress-wrap { flex: 1; max-width: 560px; }

    .progress-text {
      display: flex;
      justify-content: space-between;
      color: var(--muted);
      font-size: 13px;
      margin-bottom: 6px;
    }

    .progress {
      height: 8px;
      background: #e8eef8;
      border-radius: 999px;
      overflow: hidden;
    }

    .progress > div {
      height: 100%;
      width: 0%;
      background: var(--primary);
      transition: width .25s ease;
    }

    main {
      max-width: 1120px;
      margin: 24px auto;
      padding: 0 20px 48px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 300px;
      gap: 22px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }

    .page { min-height: 720px; padding: 28px; }

    h1, h2, h3 { line-height: 1.25; }
    h1 { margin: 0 0 16px; font-size: 30px; }
    h2 { margin: 26px 0 12px; font-size: 21px; }
    h3 { margin: 18px 0 8px; font-size: 17px; }

    .lead { color: var(--muted); font-size: 16px; margin-bottom: 18px; }

    .info-box {
      background: var(--primary-soft);
      border: 1px solid #bfdbfe;
      border-radius: 14px;
      padding: 16px;
      margin: 18px 0;
    }

    code { background: #f2f4f7; border-radius: 6px; padding: 1px 5px; }

    .score-scale {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 10px;
      margin: 16px 0;
    }

    .scale-item {
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 12px;
      background: #fff;
      font-size: 13px;
    }

    .scale-item b {
      display: block;
      color: var(--primary);
      font-size: 18px;
      margin-bottom: 3px;
    }

    .image-meta {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 16px;
      align-items: center;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 10px;
      border-radius: 999px;
      background: #f2f4f7;
      color: #344054;
      font-size: 14px;
      border: 1px solid #eaecf0;
    }

    .image-area {
      width: 100%;
      min-height: 430px;
      border-radius: 16px;
      border: 1px solid var(--line);
      background: #f9fafb;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      margin: 18px 0 20px;
    }

    .image-area img {
      max-width: 100%;
      max-height: 72vh;
      object-fit: contain;
      display: block;
    }

    .image-error { color: var(--danger); padding: 24px; text-align: center; }

    .rating-title { font-size: 18px; font-weight: 700; margin-bottom: 12px; }

    .rating-row {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 12px;
    }

    .rating-option { position: relative; }
    .rating-option input { position: absolute; opacity: 0; pointer-events: none; }

    .rating-option label {
      display: block;
      text-align: center;
      cursor: pointer;
      border: 2px solid var(--line);
      border-radius: 14px;
      padding: 14px 8px;
      background: #fff;
      transition: all .15s ease;
      user-select: none;
    }

    .rating-option label strong { display: block; font-size: 24px; line-height: 1.1; }
    .rating-option label span { display: block; color: var(--muted); font-size: 12px; margin-top: 4px; }

    .rating-option input:checked + label {
      border-color: var(--primary);
      background: var(--primary-soft);
      color: var(--primary);
      box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.08);
    }

    .actions {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-top: 24px;
      flex-wrap: wrap;
    }

    button {
      border: 0;
      border-radius: 12px;
      padding: 11px 16px;
      font-weight: 700;
      cursor: pointer;
      background: #eaecf0;
      color: #344054;
    }

    button.primary { background: var(--primary); color: #fff; }
    button.success { background: var(--success); color: #fff; }
    button:disabled { opacity: .45; cursor: not-allowed; }

    .side {
      position: sticky;
      top: 82px;
      align-self: start;
      padding: 18px;
      max-height: calc(100vh - 100px);
      overflow: auto;
    }

    .side h2 { margin-top: 0; font-size: 18px; }

    .stat-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 14px;
    }

    .stat-card {
      background: #f9fafb;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 12px;
    }

    .stat-card b { display: block; font-size: 22px; }
    .stat-card span { color: var(--muted); font-size: 12px; }

    .mini-table { width: 100%; border-collapse: collapse; font-size: 13px; }

    .mini-table th, .mini-table td {
      padding: 8px 6px;
      border-bottom: 1px solid var(--line);
      text-align: left;
      vertical-align: top;
    }

    .mini-table th {
      color: var(--muted);
      font-weight: 600;
      background: #fff;
      position: sticky;
      top: 0;
    }

    .status { margin-top: 12px; color: var(--muted); font-size: 13px; }

    textarea {
      width: 100%;
      min-height: 220px;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 12px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 12px;
      resize: vertical;
    }

    .completion { text-align: center; padding: 70px 24px; }
    .completion h1 { font-size: 34px; }

    .export-area {
      margin-top: 18px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .warn { color: var(--danger); font-weight: 700; }

    @media (max-width: 980px) {
      main { grid-template-columns: 1fr; }
      .side { position: static; max-height: none; }
      .score-scale, .rating-row { grid-template-columns: 1fr; }
      .topbar { align-items: stretch; flex-direction: column; }
      .progress-wrap { max-width: none; }
      .page { padding: 20px; min-height: auto; }
    }
  </style>
</head>

        <h3>2.4 视觉层次感</h3><p>评估画面是否有清晰的主次关系、空间层次、明暗层次和前后关系。</p>
        <h3>2.5 色彩协调度</h3><p>评估整体配色是否和谐，主色、辅助色和环境色是否协调。</p>
        <h3>2.6 信息密度</h3><p>评估画面信息量是否适中，是否过于杂乱或过于空洞，用户是否能快速理解重点。</p>

        <h2>3. 高层语义与偏好属性</h2>
        <h3>3.1 场景适配度</h3><p>评估图片是否符合用户给定的类目和场景，是否满足该场景下的视觉需求。</p>
        <h3>3.2 核心信息表达</h3><p>评估图片是否清楚表达该类目/场景下最重要的信息。</p>
        <h3>3.3 风格与情绪适配度</h3><p>评估图片的风格、氛围、光影和情绪是否符合给定类目/场景的用户预期。</p>
        <h3>3.4 有效吸引力</h3><p>评估图片在指定类目/场景下，是否具备让用户停留、产生兴趣、形成记忆、辅助判断或促进行动的能力。</p>

        <div class="actions">
          <button disabled>上一页</button>
          <button class="primary" id="startBtn" ${samples.length ? '' : 'disabled'}>
            开始评分${samples.length ? `（共 ${samples.length} 张）` : '（无图片数据）'}
          </button>
        </div>
      `;

      const startBtn = document.getElementById('startBtn');
      if (startBtn) {
        startBtn.addEventListener('click', () => {
          pageIndex = 1;
          render();
        });
      }
    }

    function renderImagePage(sample, number) {
      const selected = answers[sample.sample_key];

      pageRoot.innerHTML = `
        <div class="image-meta">
          <span class="pill">第 ${number} / ${samples.length} 张</span>
          <span class="pill">类目：<strong>${escapeHtml(sample.top_tag)}</strong></span>
          <span class="pill">场景：<strong>${escapeHtml(sample.custom_category)}</strong></span>
        </div>

        <p class="lead">
          该图片属于 <strong>${escapeHtml(sample.top_tag)}</strong> 类目下的
          <strong>${escapeHtml(sample.custom_category)}</strong> 场景。
          请在该给定类目/场景下，综合判断图片是否清晰、美观、准确、有吸引力，并是否适合该场景使用。
        </p>

        <div class="image-area">
          <img src="${escapeAttr(sample.image_url)}" alt="待评分图片 ${number}"
            onerror="this.replaceWith(Object.assign(document.createElement('div'), {className:'image-error', innerHTML:'图片加载失败，请检查 image_url 是否允许网页访问或是否仍然有效。'}))" />
        </div>

        <div class="rating-title">请选择该图片的美学质量评分</div>
        <div class="rating-row">
          ${[1,2,3,4,5].map(score => `
            <div class="rating-option">
              <input type="radio" name="rating" id="score-${score}" value="${score}" ${Number(selected) === score ? 'checked' : ''} />
              <label for="score-${score}">
                <strong>${score}</strong>
                <span>${scoreText[score]}</span>
              </label>
            </div>
          `).join('')}
        </div>

        <div class="actions">
          <button id="prevBtn">上一页</button>
          <button class="primary" id="nextBtn">${number === samples.length ? '完成评分' : '下一页'}</button>
        </div>
      `;

      document.querySelectorAll('input[name="rating"]').forEach(input => {
        input.addEventListener('change', event => {
          answers[sample.sample_key] = Number(event.target.value);
          saveAnswers();
          updateHeader();
          updateStatsPanel();
        });
      });

      document.getElementById('prevBtn').addEventListener('click', () => {
        pageIndex = Math.max(0, pageIndex - 1);
        render();
      });

      document.getElementById('nextBtn').addEventListener('click', () => {
        if (!answers[sample.sample_key]) {
          alert('请先选择 1-5 分中的一个评分。');
          return;
        }
        pageIndex += 1;
        render();
      });
    }

    function renderCompletion() {
      const rows = buildRows();
      pageRoot.innerHTML = `
        <div class="completion">
          <h1>评分完成</h1>
          <p class="lead">
            请点击“提交到阿里云 OSS”。提交后，问卷发起人可以在 OSS 的 <code>responses/</code> 目录下载该用户的 CSV 答卷。
          </p>

          <div class="stat-grid" style="max-width:420px;margin:20px auto;">
            <div class="stat-card">
              <b>${getAnsweredCount()}</b>
              <span>已评分图片数</span>
            </div>
            <div class="stat-card">
              <b>${formatNumber(getLocalAverage())}</b>
              <span>当前答卷平均分</span>
            </div>
          </div>

          <textarea readonly>${escapeHtml(toCsv(rows))}</textarea>

          <div class="export-area">
            <button id="backBtn">返回修改</button>
            <button class="success" id="submitBtn">提交到阿里云 OSS</button>
            <button class="primary" id="downloadBtn">下载 CSV 备份</button>
            <button id="clearBtn">清空本机答卷</button>
          </div>

          <p class="status" id="submitStatus">
            提交成功后，OSS 会新增一个 CSV 文件，包含该用户的 ${samples.length} 行评分记录。
          </p>
        </div>
      `;

      document.getElementById('backBtn').addEventListener('click', () => {
        pageIndex = samples.length;
        render();
      });
      document.getElementById('downloadBtn').addEventListener('click', downloadCsv);
      document.getElementById('submitBtn').addEventListener('click', submitToAliyun);
      document.getElementById('clearBtn').addEventListener('click', () => {
        if (confirm('确认清空当前浏览器里的评分记录吗？')) {
          answers = {};
          saveAnswers();
          pageIndex = 0;
          render();
        }
      });
    }

    async function submitToAliyun() {
      const status = document.getElementById('submitStatus');
      const btn = document.getElementById('submitBtn');

      if (!isApiUrlConfigured()) {
        alert('尚未配置 SUBMIT_API_URL，无法提交到阿里云。');
        return;
      }

      if (getAnsweredCount() !== samples.length) {
        alert('还有图片未评分，请返回完成所有评分。');
        return;
      }

      if (submitting) return;
      submitting = true;
      btn.disabled = true;
      status.textContent = '正在提交，请不要关闭页面……';

      const payload = {
        token: SURVEY_TOKEN,
        user_id: userId,
        submitted_at: new Date().toISOString(),
        survey_id: surveyId(),
        rows: buildRows()
      };

      try {
        const res = await fetch(SUBMIT_API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json;charset=utf-8' },
          body: JSON.stringify(payload)
        });

        let data = {};
        try { data = await res.json(); } catch (e) {}

        if (!res.ok || data.ok === false) {
          throw new Error(data.error || `HTTP ${res.status}`);
        }

        localStorage.setItem(`${storageKey}_submitted`, 'true');
        status.textContent = `提交成功。OSS 文件路径：${data.object_key || 'responses/...'}`;
        alert('提交成功，结果已保存到阿里云 OSS。');
      } catch (error) {
        status.textContent = `提交失败：${error.message || error}。请点击“下载 CSV 备份”。`;
        alert('提交失败。请下载 CSV 备份，或联系问卷发起人。');
      } finally {
        submitting = false;
        btn.disabled = false;
      }
    }

    function buildRows() {
      const now = new Date().toISOString();
      return samples.map((sample, index) => ({
        user_id: userId,
        submitted_at: now,
        image_order: index + 1,
        sample_key: sample.sample_key,
        keyword: sample.keyword,
        id: sample.id,
        top_tag: sample.top_tag,
        custom_category: sample.custom_category,
        poiid: sample.poiid,
        image_url: sample.image_url,
        plan_type: sample.plan_type,
        bucket: sample.bucket,
        score: answers[sample.sample_key] || ''
      }));
    }

    function toCsv(rows) {
      const headers = [
        'user_id', 'submitted_at', 'image_order', 'sample_key', 'keyword',
        'id', 'top_tag', 'custom_category', 'poiid', 'image_url',
        'plan_type', 'bucket', 'score'
      ];

      const lines = [headers.join(',')];
      rows.forEach(row => lines.push(headers.map(h => csvEscape(row[h])).join(',')));
      return '\ufeff' + lines.join('\n');
    }

    function csvEscape(value) {
      const text = value === null || value === undefined ? '' : String(value);
      return `"${text.replaceAll('"', '""')}"`;
    }

    function downloadCsv() {
      const csv = toCsv(buildRows());
      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `image_aesthetic_survey_${userId}.csv`;
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
    }

    function updateHeader() {
      const total = samples.length;
      const answered = getAnsweredCount();
      answeredLabel.textContent = `已评分 ${answered} / ${total}`;

      if (pageIndex === 0) progressLabel.textContent = '说明页';
      else if (pageIndex > total) progressLabel.textContent = '完成页';
      else progressLabel.textContent = `第 ${pageIndex} / ${total} 张`;

      const pct = total ? Math.round((answered / total) * 100) : 0;
      progressBar.style.width = `${pct}%`;
    }

    function updateStatsPanel() {
      const answered = getAnsweredCount();
      statAnswered.textContent = answered;
      statAvg.textContent = formatNumber(getLocalAverage());

      statsBody.innerHTML = samples.map((sample, index) => {
        const score = answers[sample.sample_key] || '-';
        return `
          <tr>
            <td>#${index + 1}<br><span style="color:var(--muted)">${escapeHtml(sample.top_tag)} / ${escapeHtml(sample.custom_category)}</span></td>
            <td>${score}</td>
          </tr>
        `;
      }).join('');
    }

    function getAnsweredCount() {
      return samples.filter(sample => answers[sample.sample_key]).length;
    }

    function getLocalAverage() {
      const values = samples.map(sample => answers[sample.sample_key]).filter(Boolean);
      if (!values.length) return null;
      return values.reduce((sum, n) => sum + Number(n), 0) / values.length;
    }

    function loadAnswers() {
      try {
        const loaded = JSON.parse(localStorage.getItem(storageKey) || '{}');
        const validKeys = new Set(samples.map(s => s.sample_key));
        Object.keys(loaded).forEach(key => {
          if (!validKeys.has(key)) delete loaded[key];
        });
        return loaded;
      } catch {
        return {};
      }
    }

    function saveAnswers() {
      localStorage.setItem(storageKey, JSON.stringify(answers));
    }

    function getUserId() {
      let id = localStorage.getItem('aesthetic_survey_user_id');
      if (!id) {
        id = `user_${Date.now()}_${Math.random().toString(16).slice(2)}`;
        localStorage.setItem('aesthetic_survey_user_id', id);
      }
      return id;
    }

    function surveyId() {
      const keys = samples.map(s => s.sample_key).join('|');
      let hash = 0;
      for (let i = 0; i < keys.length; i++) {
        hash = ((hash << 5) - hash) + keys.charCodeAt(i);
        hash |= 0;
      }
      return Math.abs(hash);
    }

    function isApiUrlConfigured() {
      return SUBMIT_API_URL.startsWith('http://') || SUBMIT_API_URL.startsWith('https://');
    }

    function formatNumber(value) {
      if (value === null || value === undefined || Number.isNaN(Number(value))) return '-';
      return Number(value).toFixed(2);
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');
    }

    function escapeAttr(value) {
      return escapeHtml(value);
    }
  </script>
</body>
</html>
